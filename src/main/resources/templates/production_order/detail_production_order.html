<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lệnh sản xuất chi tiết</title>

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Libraries Stylesheet -->
    <link href="/assert/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/assert/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet"/>

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/assert/css/style/homepage/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/assert/css/style/homepage/home-page-style.css" rel="stylesheet">

    <link rel="stylesheet" href="/assert/css/style/production-order/production-order-detail.css">
</head>
<body>
<div class="container-fluid position-relative bg-white d-flex p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Sidebar Start -->
    <div th:replace="~{shared/sidebar.html :: sidebar}"></div>
    <!-- Sidebar End -->

    <!-- Content Start -->
    <div class="content">
        <!-- Navbar Start -->
        <div th:replace="~{shared/navbar.html :: navbar}"></div>
        <!-- Navbar End -->

        <div class="container-fluid py-3">
            <!--&lt;!&ndash; Alerts Section &ndash;&gt;
            <div class="row mb-3">
                <div class="col-12">
                    <div class="alert alert-success alert-dismissible fade show" th:if="${success}" role="alert">
                        <i class="fa fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" role="alert">
                        <i class="fa fa-exclamation-circle me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>
            </div>-->

            <!-- Breadcrumbs Section -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/production-order/list}"><i class="fas fa-list me-1"></i>Lệnh sản xuất</a></li>
                    <li class="breadcrumb-item active">Chi tiết</li>
                </ol>
            </nav>

            <!-- Header Card -->
            <div class="card mb-4">
                <div class="card-header bg-light d-flex justify-content-between align-items-center flex-wrap">
                    <div>
                        <h5 class="mb-0">Đơn đặt hàng - <span class="fw-bold" th:text="${productionOrder.id}"></span></h5>
                    </div>
                    <div>
                        <span th:switch="${productionOrder.status}" class="badge rounded-pill fs-6">
                            <span th:case="${T(fpt.g36.gapms.enums.BaseEnum).APPROVED}" th:text="'Đã được duyệt'"
                                  class="badge bg-success">
                            </span>
                            <span th:case="${T(fpt.g36.gapms.enums.BaseEnum).NOT_APPROVED}" th:text="'Chưa được phê duyệt'"
                                  class="badge bg-warning">
                            </span>
                            <span th:case="${T(fpt.g36.gapms.enums.BaseEnum).WAIT_FOR_APPROVAL}" th:text="'Đang chờ phê duyệt'"
                                  class="badge bg-info">
                            </span>
                            <span th:case="${T(fpt.g36.gapms.enums.BaseEnum).CANCELED}" th:text="'Đã hủy'" class="badge bg-danger"></span>
                            <span th:case="${T(fpt.g36.gapms.enums.BaseEnum).DRAFT}" th:text="'Sơ thảo'" class="badge bg-secondary"></span>
                            <span th:case="*" th:text="'Trạng thái không xác định'" class="badge bg-secondary"></span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Detail Table Card -->
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Chi tiết lệnh sản xuất</h5>
                </div>
                <div class="card-body p-0">
                    <p class="mobile-scroll-hint"><i class="fas fa-hand-point-right me-1"></i>Vuốt qua để xem toàn bộ bảng</p>
                    <div class="table-responsive">
                        <table id="order-table" class="table table-hover table-striped mb-0 text-center">
                            <thead class="bg-light">
                            <tr>
                                <th>Loại hàng</th>
                                <th>Loại sợi</th>
                                <th>Định mức</th>
                                <th>Khối lượng sợi</th>
                                <th>Môi trường AS</th>
                                <th>Số quy trình</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${productionOrderDetailList}" th:data-id="${item.id}" onclick="loadDetailData(this.getAttribute('data-id'))" style="cursor: pointer;">
                                <td th:text="${item.category}"></td>
                                <td th:text="${item.threadName}"></td>
                                <td th:text="${item.rate}"></td>
                                <td th:text="${item.threadMass != null ? item.threadMass : 'N/A'}"></td>
                                <td>
                                    <span th:if="${item.lightEnv}" class="badge bg-info text-dark">AD</span>
                                    <span th:unless="${item.lightEnv}" class="badge bg-secondary">TN</span>
                                </td>
                                <td th:text="${item.process}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Fixed Action Buttons (Mobile) -->
            <div class="fixed-action-bar" th:if="${#authorization.expression('hasRole(''SALE_STAFF'')') || #authorization.expression('hasRole(''SALE_MANAGER'')')}">
                <div class="action-buttons">
                    <div th:if="${#authorization.expression('hasRole(''SALE_STAFF'')')}">
                        <form th:if="${productionOrder.status.name() == 'DRAFT'}"
                              th:action="@{'/production-order/detail/' + ${productionOrder.id}}" method="post" class="mb-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-check me-1"></i> Xác nhận
                            </button>
                        </form>
                        <form th:if="${productionOrder.status.name() == 'NOT_APPROVED'}"
                              th:action="@{'/production-order/detail/' + ${productionOrder.id}}"
                              method="post"
                              onsubmit="return confirmSendProduction(event)">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-check me-1"></i> Gửi lệnh sản xuất
                            </button>
                        </form>
                    </div>
                    <a th:href="@{/production-order/list}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Trở lại
                    </a>
                </div>
            </div>

            <!-- Detail Form Card -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Thông tin chi tiết</h5>
                </div>
                <div class="card-body">
                    <div id="order-info" class="detail-form-container">
                        <form id="detailForm" th:action="@{/production-order/detail/update/0}" method="post" class="row g-3" th:object="${productionOrderDetail}">
                            <input type="hidden" id="detailId" name="id" th:value="*{id}">
                            <input type="hidden" id="productionOrderIdField" name="productionOrderId" th:value="*{productionOrderId}">

                            <div class="col-md-6">
                                <!-- Left column -->
                                <div class="mb-3">
                                    <label for="category" class="form-label">Loại hàng:</label>
                                    <input type="text" class="form-control" id="category" name="category" th:value="*{category}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="threadName" class="form-label">Loại sợi:</label>
                                    <input type="text" class="form-control" id="threadName" name="threadName" th:value="*{threadName}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="rate" class="form-label">Định mức:</label>
                                    <input type="text" class="form-control" id="rate" name="rate" th:value="*{rate}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="threadMass" class="form-label">Khối lượng sợi:</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="threadMass" name="threadMass" th:value="*{threadMass}"
                                               th:readonly="${!#authorization.expression('hasRole(''SALE_STAFF'')') || productionOrder.status.name() != 'NOT_APPROVED'}" disabled>
                                        <span class="input-group-text">kg</span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="lightEnv" class="form-label">Môi trường AS:</label>
                                    <select id="lightEnv" class="form-select" name="lightEnv"
                                            th:disabled="${!#authorization.expression('hasRole(''SALE_STAFF'')') || productionOrder.status.name() != 'NOT_APPROVED'}">
                                        <option value="true" th:selected="*{lightEnv}">Ánh đèn (AD)</option>
                                        <option value="false" th:selected="*{!lightEnv}">Tự nhiên (TN)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <!-- Right column -->
                                <div class="mb-3">
                                    <label for="brandName" class="form-label">Nhãn hiệu:</label>
                                    <input type="text" class="form-control" id="brandName" name="brandName" th:value="*{brandName}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="noteColor" class="form-label">Tên màu:</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="noteColor" name="noteColor" th:value="*{noteColor}" readonly>
                                        <span class="input-group-text">
                                            <div id="colorDisplay" style="width: 20px; height: 20px; border-radius: 50%;"></div>
                                        </span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="quantity" class="form-label">Số lượng:</label>
                                    <input type="number" class="form-control" id="quantity" name="quantity" th:value="*{quantity}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="process" class="form-label">Số quy trình:</label>
                                    <input type="text" class="form-control" id="process" name="process" th:value="*{process}" readonly>
                                </div>
                            </div>
                            <div class="col-12 text-center mt-4" th:if="${#authorization.expression('hasRole(''SALE_STAFF'')')} and ${productionOrder.status.name() == 'NOT_APPROVED'}">
                                <button id="submitButton" type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i> Lưu thay đổi
                                </button>
                                <div class="form-text mt-2">Chọn một dòng từ bảng để chỉnh sửa thông tin chi tiết</div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Action Buttons (Desktop) -->
            <div class="card mb-4 action-buttons-container" th:if="${#authorization.expression('hasRole(''SALE_STAFF'')') || #authorization.expression('hasRole(''SALE_MANAGER'')')}">
                <div class="card-body p-3">
                    <div class="d-flex flex-wrap gap-2 action-buttons">
                        <div th:if="${#authorization.expression('hasRole(''SALE_STAFF'')')}" class="d-flex flex-wrap gap-2">
                            <form th:if="${productionOrder.status.name() == 'DRAFT'}"
                                  th:action="@{'/production-order/detail/' + ${productionOrder.id}}" method="post">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check me-1"></i> Xác nhận
                                </button>
                            </form>
                            <form th:if="${productionOrder.status.name() == 'NOT_APPROVED'}"
                                  th:action="@{'/production-order/detail/' + ${productionOrder.id}}"
                                  method="post"
                                  onsubmit="return confirmSendProduction(event)">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-check me-1"></i> Gửi lệnh sản xuất
                                </button>
                            </form>
                        </div>
                        <a th:href="@{/production-order/list}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Trở lại
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay d-none">
    <div class="spinner-border text-primary loading-spinner" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<!-- Content End -->
<div th:if="${success}">
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            Swal.fire({
                position: "top-end",
                icon: "success",
                text: /*[[${success}]]*/ "Default message",
                showConfirmButton: true,
                timer: 3000
            });
        });
    </script>
</div>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assert/lib/chart/chart.min.js"></script>
<script src="/assert/lib/easing/easing.min.js"></script>
<script src="/assert/lib/waypoints/waypoints.min.js"></script>
<script src="/assert/lib/owlcarousel/owl.carousel.min.js"></script>
<script src="/assert/lib/tempusdominus/js/moment.min.js"></script>
<script src="/assert/lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="/assert/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    function confirmSendProduction(event) {
        event.preventDefault(); // Ngăn submit form ngay lập tức

        Swal.fire({
            title: 'Xác nhận gửi lệnh sản xuất',
            text: 'Bạn có chắc chắn muốn gửi lệnh sản xuất này?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Có, gửi!',
            cancelButtonText: 'Hủy'
        }).then((result) => {
            if (result.isConfirmed) {
                event.target.submit(); // Submit form nếu người dùng xác nhận
            }
        });

        return false; // Ngăn submit mặc định
    }
</script>
<!-- Template Javascript -->
<script src="/assert/js/main.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Vô hiệu hóa form khi tải trang nếu chưa có ID nào được chọn
        const submitButton = document.getElementById('submitButton');
        const submitButtonMobile = document.getElementById('submitButtonMobile');

        if (submitButton) {
            submitButton.disabled = true;
        }

        if (submitButtonMobile) {
            submitButtonMobile.disabled = true;
        }

        // Xử lý hiển thị ban đầu cho các trường
        handleInitialDisplay();
    });

    function handleInitialDisplay() {
        // Nếu có noteColor, hiển thị màu
        const noteColorField = document.getElementById('noteColor');
        const colorDisplay = document.getElementById('colorDisplay');

        if (noteColorField && colorDisplay && noteColorField.value) {
            try {
                colorDisplay.style.backgroundColor = noteColorField.value;
            } catch (e) {
                // Nếu giá trị màu không hợp lệ, đặt màu mặc định
                colorDisplay.style.backgroundColor = '#ccc';
            }
        }
    }

    function showLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.classList.remove('d-none');
        }
    }

    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.classList.add('d-none');
        }
    }

    function loadDetailData(id) {
        showLoading();

        // Sử dụng AJAX để lấy dữ liệu chi tiết từ server
        fetch('/production-order/api/detail/' + id)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                console.log("Received data:", data);

                // Kiểm tra xem form có tồn tại không trước khi cập nhật
                const form = document.getElementById('detailForm');
                if (!form) {
                    console.error("Form with ID 'detailForm' not found in the DOM");
                    alert("Lỗi: Không tìm thấy form trên trang. Vui lòng tải lại trang.");
                    return;
                }

                // Cập nhật form action với contextPath và đường dẫn đúng
                form.action = '/production-order/detail/update/' + id;

                // Kiểm tra từng phần tử trước khi cập nhật
                const updateField = (fieldId, value) => {
                    const field = document.getElementById(fieldId);
                    if (field) {
                        // Xử lý giá trị null bằng cách đặt thành chuỗi rỗng
                        field.value = (value !== null && value !== undefined) ? value : '';

                        // Thêm animation highlight cho trường vừa cập nhật
                        field.classList.add('highlight-animation');
                        setTimeout(() => {
                            field.classList.remove('highlight-animation');
                        }, 2000);
                    } else {
                        console.warn(`Field with ID '${fieldId}' not found`);
                    }
                };

                // Cập nhật các trường form - xử lý null
                updateField('detailId', id);
                updateField('category', data.category);
                updateField('threadName', data.threadName);
                updateField('rate', data.rate);
                updateField('threadMass', data.threadMass);

                // Xử lý select box cho lightEnv
                const lightEnvSelect = document.getElementById('lightEnv');
                if (lightEnvSelect) {
                    lightEnvSelect.value = data.lightEnv ? 'true' : 'false';
                }

                updateField('brandName', data.brandName);
                updateField('noteColor', data.noteColor);
                updateField('quantity', data.quantity);
                updateField('process', data.process);
                updateField('productionOrderIdField', data.productionOrderId);

                // Cập nhật hiển thị màu
                const colorDisplay = document.getElementById('colorDisplay');
                if (colorDisplay && data.noteColor) {
                    try {
                        colorDisplay.style.backgroundColor = data.noteColor;
                    } catch (e) {
                        colorDisplay.style.backgroundColor = '#ccc';
                    }
                }

                // Bật lại nút submit (cả desktop và mobile)
                const submitButton = document.getElementById('submitButton');
                const submitButtonMobile = document.getElementById('submitButtonMobile');

                if (submitButton) {
                    submitButton.disabled = false;
                }

                if (submitButtonMobile) {
                    submitButtonMobile.disabled = false;
                }

                // Thêm class đánh dấu hàng đang được chọn
                const allRows = document.querySelectorAll('#order-table tbody tr');
                allRows.forEach(row => {
                    row.classList.remove('table-primary', 'selected-row');
                });
                const selectedRow = document.querySelector(`tr[data-id="${id}"]`);
                if (selectedRow) {
                    selectedRow.classList.add('table-primary', 'selected-row');

                    // Đảm bảo hàng được chọn hiển thị trong tầm nhìn trên thiết bị di động
                    if (window.innerWidth < 768) {
                        selectedRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }

                hideLoading();
            })
            .catch(error => {
                console.error('Error fetching detail data:', error);
                hideLoading();

                // Hiển thị thông báo lỗi thân thiện với người dùng
                alert('Không thể tải dữ liệu chi tiết. Vui lòng thử lại sau.');
            });
    }

    // Form submission handling
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('detailForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                const submitButton = document.getElementById('submitButton');
                if (submitButton) {
                    submitButton.disabled = true;
                    submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang lưu...';
                }

                // Hiển thị overlay loading
                showLoading();
            });
        }
    });
</script>

</body>
</html>
